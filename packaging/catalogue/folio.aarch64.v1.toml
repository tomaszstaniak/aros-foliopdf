id              = "folio"
version         = "0.5"
revision        = 1
summary         = "PDF reader with two-page spreads, search and highlighting"
category        = "office/misc"
license         = "AGPL-3.0-or-later"
kind            = "app"
arch            = "aarch64"
abi             = "v1"
subdir          = "Folio"
icon            = "Folio.info"
depends         = []
depends_checked = true
post_install_notes = [
  "Native Raspberry Pi build; not validated on hosted Macaros.",
  "This 0.5 binary has been compiled and linked, not run. See BUILD-REPORT.md.",
  "Launch from the Folio icon, which sets an 8 MiB stack. Shell: Stack 8388608.",
  "Opening external web links requires openurl.library.",
]

[[requires_system]]
type = "library"
id = "posixc.library"

[[requires_system]]
type = "library"
id = "stdc.library"

[[requires_system]]
type = "library"
id = "stdcio.library"

[[requires_system]]
type = "library"
id = "muimaster.library"

[[requires_system]]
type = "library"
id = "asl.library"

[[requires_system]]
type = "library"
id = "iffparse.library"

[[requires_system]]
type = "library"
id = "cybergraphics.library"

[source]
repository = "https://github.com/tomaszstaniak/aros-foliopdf"
revision = "v0.5"
archive = "Folio-0.5-source.zip"

# How Folio is started (arospkg 0.5 and later, RFC 0002): from its icon,
# which sets the 8 MiB stack. apkg-pack build writes Folio/application.json
# from this table into the release archive.
[launch]
executable = "Folio"
mode       = "workbench"
